<!doctype html>
<html lang="en">
<head>

  <title>Home | Antony L. Tran</title>
  <style>
    body.home { margin: 0; min-height: 100svh; }
    .portrait {
      position: absolute;
      top: 50vh;
      top: 50svh;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(35.714vw, 540px);

    .portrait > img { display: block; width: 100%; height: auto; }
